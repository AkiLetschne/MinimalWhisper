name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # Native modules are not needed for linting, type checking, the renderer
      # build or the fork's own tests. The full upstream suite (npm test) still
      # has failures in features this fork hides and needs Electron-built
      # native modules.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npm run build:renderer
